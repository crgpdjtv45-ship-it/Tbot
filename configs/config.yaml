# Configuration for Bybit Statistical Arbitrage Bot

bybit:
  testnet: true                        # Set true for Testnet, false for Real account
  api_key: ""                          # Bybit API Key
  api_secret: ""                       # Bybit API Secret
  category: "linear"                   # 'linear' for USDT/USDC Perpetual Futures
  recv_window: 5000

strategy:
  # Pair parameters
  timeframe: "240"                     # Candle timeframe: 240 (4h recommended for low fee impact)
  lookback_days: 180                   # Historical days used for cointegration & hedge ratio
  
  # Statistical arbitrage signals
  entry_z_score: 2.0                   # Enter trade when |Z| >= entry_z_score
  exit_z_score: 0.2                    # Exit trade when |Z| <= exit_z_score (mean reversion)
  stop_loss_z_score: 3.8               # Emergency stop when |Z| >= stop_loss_z_score
  max_half_life_days: 7.0              # Max half life for cointegrated spread to revert
  p_value_threshold: 0.05              # ADF cointegration p-value threshold (0.05 = 95% confidence)
  
  # Hedge Ratio model
  hedge_ratio_method: "kalman"         # 'kalman' (dynamic adaptive) or 'ols' (static linear regression)

risk:
  max_open_pairs: 3                    # Maximum simultaneous pair positions
  capital_per_pair_pct: 20.0           # Max % of equity allocated per pair trade (e.g. 20%)
  leverage: 2                          # Conservative leverage for pairs trading (1x - 3x recommended)
  max_account_drawdown_pct: 10.0       # Stop all trading if total account equity drops by 10%
  slippage_tolerance_pct: 0.2          # Max slippage when executing legs

telegram:
  enabled: true
  bot_token: "9157590662:AAGjN0hqhnw9bIpy0BkQ0WIOFlKBqghfFyY"
  chat_id: "984174352"
  alerts:
    on_signal: true
    on_entry: true
    on_exit: true
    on_error: true
    daily_summary: true
